version: '3.8'

services:
  # 1. DATABASE 
  netmon-db:
    image: mariadb:10.11
    container_name: zabbix-db
    environment:
      - MYSQL_ROOT_PASSWORD=root_netmon
      - MYSQL_USER=zabbix
      - MYSQL_PASSWORD=zabbix_pwd
      - MYSQL_DATABASE=zabbix
    volumes:
      - ./db_data:/var/lib/mysql
    restart: always

  # 2. ZABBIX SERVER 
  zabbix-server:
    image: zabbix/zabbix-server-mysql:alpine-7.0-latest
    container_name: zabbix-server
    environment:
      - DB_SERVER_HOST=netmon-db
      - MYSQL_USER=zabbix
      - MYSQL_PASSWORD=zabbix_pwd
      - MYSQL_DATABASE=zabbix
    ports:
      - "10051:10051"
    depends_on:
      - netmon-db
    restart: always

  # 3. ZABBIX WEB UI 
  zabbix-web:
    image: zabbix/zabbix-web-nginx-mysql:alpine-7.0-latest
    container_name: zabbix-web
    environment:
      - DB_SERVER_HOST=netmon-db
      - MYSQL_USER=zabbix
      - MYSQL_PASSWORD=zabbix_pwd
      - MYSQL_DATABASE=zabbix
      - ZBX_SERVER_HOST=zabbix-server
      - PHP_TZ=Asia/Jakarta
    ports:
      - "8080:8080"
    depends_on:
      - netmon-db
      - zabbix-server
    restart: always

  # 4. GRAFANA 
  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    ports:
      - "3000:3000"
    volumes:
      - ./grafana_data:/var/lib/grafana
    depends_on:
      - zabbix-server
    restart: always